name: CD — Staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Git SHA or tag to deploy'
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-timequest-staging-san
  ENVIRONMENT_NAME: staging

jobs:
  deploy-infra:
    name: Deploy Infra (Bicep)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        run: |
          az group create \
            --name $AZURE_RESOURCE_GROUP \
            --location southafricanorth \
            --tags environment=staging project=timequest

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group $AZURE_RESOURCE_GROUP \
            --template-file infra/main.bicep \
            --parameters infra/parameters/staging.bicepparam \
            --parameters sqlAdminObjectId=${{ secrets.SQL_ADMIN_OBJECT_ID }} \
            --parameters sqlAdminLogin=${{ secrets.SQL_ADMIN_LOGIN }} \
            --name deploy-$(date +%Y%m%d-%H%M%S)

  deploy-app:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish TimeQuest/TimeQuest.csproj --configuration Release --output ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-timequest-staging-san
          package: ./publish
