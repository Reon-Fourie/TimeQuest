name: CD — Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Git SHA or tag to deploy'
        required: true
      confirmed:
        description: 'Type DEPLOY to confirm production deployment'
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-timequest-prod-san
  ENVIRONMENT_NAME: prod

jobs:
  validate-confirmation:
    name: Validate deployment confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ inputs.confirmed }}" != "DEPLOY" ]; then
            echo "Production deployment not confirmed. Input 'DEPLOY' to proceed."
            exit 1
          fi

  deploy-infra:
    name: Deploy Infra (Bicep)
    runs-on: ubuntu-latest
    needs: validate-confirmation
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        run: |
          az group create \
            --name $AZURE_RESOURCE_GROUP \
            --location southafricanorth \
            --tags environment=prod project=timequest

      - name: Deploy Bicep (what-if preview)
        run: |
          az deployment group what-if \
            --resource-group $AZURE_RESOURCE_GROUP \
            --template-file infra/main.bicep \
            --parameters infra/parameters/prod.bicepparam \
            --parameters sqlAdminObjectId=${{ secrets.SQL_ADMIN_OBJECT_ID }} \
            --parameters sqlAdminLogin=${{ secrets.SQL_ADMIN_LOGIN }}

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group $AZURE_RESOURCE_GROUP \
            --template-file infra/main.bicep \
            --parameters infra/parameters/prod.bicepparam \
            --parameters sqlAdminObjectId=${{ secrets.SQL_ADMIN_OBJECT_ID }} \
            --parameters sqlAdminLogin=${{ secrets.SQL_ADMIN_LOGIN }} \
            --name deploy-$(date +%Y%m%d-%H%M%S)

  deploy-app:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish TimeQuest/TimeQuest.csproj --configuration Release --output ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-timequest-prod-san
          package: ./publish

      - name: Smoke test
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://app-timequest-prod-san.azurewebsites.net/)
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            echo "Production smoke test failed: HTTP $STATUS"
            exit 1
          fi
          echo "Production smoke test passed: HTTP $STATUS"
